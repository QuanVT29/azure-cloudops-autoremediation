apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-banking-secrets
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "1e76abc6-b1fc-42a5-b57b-2ccaa5797f68"
    keyvaultName: "kv-bank-prod-b4gm5y"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: sql-connection-string
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
    tenantId: "4e105fc6-fff8-4ede-8c19-477d15b4e57a"
  secretObjects:
    - secretName: banking-db-secrets
      type: Opaque
      data:
        - objectName: sql-connection-string
          key: SQL_CONNECTION_STRING
        - objectName: redis-connection-string
          key: REDIS_CONNECTION_STRING